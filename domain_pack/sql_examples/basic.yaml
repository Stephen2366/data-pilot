# M3 v0 模板 SQL / M4 few-shot 示例
#
# ★ 这些示例来自已经跑通的模板 SQL。M4 接 LLM 时优先把它们作为 few-shot，而不是
# 重新发明 SQL 口径。
examples:
  - id: highest_refund_rate_product_june_2026
    question: 2026年6月退款率最高的商品是什么？
    route: sql
    expected_tables: [products, orders, refunds]
    sql: |
      SELECT
        p.product_name,
        COUNT(DISTINCT r.id) AS refund_count,
        COUNT(DISTINCT o.id) AS order_count,
        ROUND(COUNT(DISTINCT r.id) * 1.0 / COUNT(DISTINCT o.id), 4) AS refund_rate
      FROM products p
      JOIN orders o ON o.product_id = p.id
      LEFT JOIN refunds r ON r.order_id = o.id
      WHERE o.paid_at >= :month_start AND o.paid_at < :month_end
      GROUP BY p.id, p.product_name
      ORDER BY refund_rate DESC, p.product_name ASC
      LIMIT 5
  - id: channel_order_count
    question: 各渠道订单量是多少？
    route: sql
    expected_tables: [channels, orders]
    sql: |
      SELECT
        c.channel_name,
        COUNT(o.id) AS order_count
      FROM channels c
      JOIN orders o ON o.channel_id = c.id
      GROUP BY c.id, c.channel_name
      ORDER BY order_count DESC, c.channel_name ASC
  - id: gmv_june_2026
    question: 2026年6月本月GMV是多少？
    route: sql
    expected_tables: [orders]
    sql: |
      SELECT
        ROUND(SUM(o.order_amount), 2) AS gmv
      FROM orders o
      WHERE o.paid_at >= :month_start
        AND o.paid_at < :month_end
        AND o.order_status NOT IN ('cancelled', 'canceled')
  - id: top_refund_reason
    question: Top退款原因是什么？
    route: sql
    expected_tables: [refunds]
    sql: |
      SELECT
        r.refund_reason,
        COUNT(r.id) AS refund_count
      FROM refunds r
      GROUP BY r.refund_reason
      ORDER BY refund_count DESC, r.refund_reason ASC
      LIMIT 5
  - id: pending_high_priority_tickets
    question: 待处理高优先级工单有多少？
    route: sql
    expected_tables: [tickets]
    sql: |
      SELECT
        COUNT(t.id) AS pending_high_priority_tickets
      FROM tickets t
      WHERE t.status = 'pending' AND t.priority = 'high'
  - id: item_gmv_top_products_june_2026
    question: 2026 年 6 月商品销售额 Top 5 是哪些？
    route: sql
    expected_tables: [orders, order_items, products]
    sql: |
      SELECT
        p.product_name,
        ROUND(SUM(oi.line_amount), 2) AS item_gmv
      FROM order_items oi
      JOIN orders o ON o.id = oi.order_id
      JOIN products p ON p.id = oi.product_id
      WHERE o.paid_at >= :month_start
        AND o.paid_at < :month_end
        AND o.order_status NOT IN ('cancelled', 'canceled')
      GROUP BY p.id, p.product_name
      ORDER BY item_gmv DESC, p.product_name ASC
      LIMIT 5
  - id: june_fixed_50_channel_usage
    question: JUNE_FIXED_50 在哪个渠道使用最多？
    route: sql
    expected_tables: [orders, channels, order_coupons, coupons]
    sql: |
      SELECT
        c.channel_name,
        COUNT(DISTINCT o.id) AS coupon_order_count
      FROM orders o
      JOIN channels c ON c.id = o.channel_id
      JOIN order_coupons oc ON oc.order_id = o.id
      JOIN coupons cp ON cp.id = oc.coupon_id
      WHERE cp.coupon_code = 'JUNE_FIXED_50'
      GROUP BY c.id, c.channel_name
      ORDER BY coupon_order_count DESC, c.channel_name ASC
      LIMIT 5
  - id: net_revenue_june_2026
    question: 2026 年 6 月净收入是多少？
    route: sql
    expected_tables: [orders]
    sql: |
      SELECT
        ROUND(SUM(o.actual_amount), 2) AS net_revenue
      FROM orders o
      WHERE o.paid_at >= :month_start
        AND o.paid_at < :month_end
        AND o.order_status NOT IN ('cancelled', 'canceled')
  - id: behavior_conversion_by_device
    question: 哪个设备类型加购到支付转化率最高？
    route: sql
    expected_tables: [user_behavior_log]
    sql: |
      SELECT
        device_type,
        SUM(CASE WHEN event_type = 'payment_success' THEN 1 ELSE 0 END) * 1.0
          / SUM(CASE WHEN event_type = 'add_to_cart' THEN 1 ELSE 0 END) AS conversion_rate
      FROM user_behavior_log
      GROUP BY device_type
      ORDER BY conversion_rate DESC, device_type ASC
      LIMIT 5
  - id: aurora_avg_price_june_2026
    question: Aurora 耳机 2026 年 6 月历史均价是多少？
    route: sql
    expected_tables: [products, product_price_history]
    sql: |
      SELECT
        p.product_name,
        ROUND(AVG(pph.price), 2) AS avg_price
      FROM products p
      JOIN product_price_history pph ON pph.product_id = p.id
      WHERE p.sku = 'SKU-HIGH-REFUND-01'
        AND pph.valid_from < :month_end
        AND (pph.valid_to IS NULL OR pph.valid_to > :month_start)
      GROUP BY p.id, p.product_name
