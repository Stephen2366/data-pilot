# DataPilot M3 KPI 口径
#
# ★ 这里只放业务口径，不放执行逻辑。engine/ 读取这些定义后，才能在不硬编码业务含义的
# 前提下理解 GMV、退款率等指标。
metrics:
  refund_rate:
    name: 退款率
    formula: completed_refunded_order_count / completed_order_count
    numerator: COUNT(DISTINCT CASE WHEN refunds.refund_status = 'completed' THEN refunds.order_id END)
    denominator: COUNT(DISTINCT orders.id)
    filter: orders.order_status NOT IN ('cancelled', 'canceled') AND orders.paid_at IS NOT NULL
    default_time_field: orders.paid_at
    description: 按成交订单统计已完成退款的去重订单数占成交订单数的比例；商品维度优先用 refunds.order_item_id -> order_items.product_id，整单退款在 order_item_id 为空时回退 refunds.product_id，不能用 INNER JOIN 静默丢弃。
  gmv:
    name: GMV
    formula: SUM(orders.order_amount)
    filter: orders.order_status NOT IN ('cancelled', 'canceled') AND orders.paid_at IS NOT NULL
    default_time_field: orders.paid_at
    description: 成交总额，默认不含运费、不扣优惠，排除未支付和已取消订单。
  item_gmv:
    name: 商品维度GMV
    formula: SUM(order_items.line_amount)
    filter: orders.order_status NOT IN ('cancelled', 'canceled') AND orders.paid_at IS NOT NULL
    default_time_field: orders.paid_at
    description: 商品销售额默认从订单明细聚合，再关联订单头套用支付和取消过滤。
  net_revenue:
    name: 净收入
    formula: SUM(orders.actual_amount)
    filter: orders.order_status NOT IN ('cancelled', 'canceled') AND orders.paid_at IS NOT NULL
    default_time_field: orders.paid_at
    description: 实付金额口径，actual_amount = order_amount + shipping_amount - discount_amount。
  order_count:
    name: 订单量
    formula: COUNT(DISTINCT orders.id)
    default_time_field: orders.paid_at
    description: 订单事实表中的去重订单数；直接查询 orders 时 COUNT(orders.id) 等价，但 join 明细、退款或优惠券后必须 COUNT(DISTINCT orders.id)。未明确“成交”时默认统计全部订单，成交订单量另加 paid_at 和取消状态过滤。
  coupon_order_count:
    name: 优惠券使用订单数
    formula: COUNT(DISTINCT order_coupons.order_id)
    default_time_field: orders.paid_at
    description: 指定优惠券或优惠券类型已关联 order_coupons 的去重订单数；它是计数，不是优惠券使用率。除非题面明确“成交后使用”，否则不默认排除取消或未支付订单。
  refund_count:
    name: 退款量
    formula: COUNT(refunds.id)
    default_time_field: refunds.requested_at
    description: 退款事实表中的退款记录数量。
  net_refund_amount:
    name: 实际净退款金额
    formula: SUM(refunds.refund_amount)
    filter: refunds.refund_status = 'completed'
    default_time_field: refunds.processed_at
    description: 已完成退款按处理完成时间统计的带符号金额；负数 refund_amount 是冲销修正，必须保留负号，requested、approved、rejected 不计入实际退款金额。
  coupon_usage_rate:
    name: 优惠券使用率
    formula: COUNT(DISTINCT order_coupons.order_id) / COUNT(DISTINCT orders.id)
    default_time_field: orders.paid_at
    description: 统计使用某类或某张优惠券的订单占比，一单多券时订单量必须去重。
  add_to_pay_conversion_rate:
    name: 加购到支付转化率
    formula: payment_success_events / add_to_cart_events
    default_time_field: user_behavior_log.event_time
    description: 从行为日志计算支付成功事件数占加购事件数的比例，可按 device_type 分组。
  avg_selling_price:
    name: 历史平均售价
    formula: AVG(product_price_history.price)
    default_time_field: product_price_history.valid_from
    description: 历史价格记录在题目时间范围内有交集时，按记录条数计算 price 的算术平均值；不是按有效天数加权。
  pending_high_priority_ticket_count:
    name: 待处理高优先级工单数
    formula: COUNT(tickets.id)
    filter: tickets.status = 'pending' AND tickets.priority = 'high'
    default_time_field: tickets.created_at
    description: 客服运营中需要优先关注的待处理高优先级工单数量。
