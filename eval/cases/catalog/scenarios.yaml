  - id: june_channel_gmv_dashboard
    question: 查看 2026 年 6 月各渠道 GMV；可使用订单明细口径或 orders_wide 快照口径。业务月份按订单支付时间统计。
    user_role: ops
    classification: core
    tags: [database, schema_alternative, gmv]
    assertions:
      - id: semantic_result
        kind: result_match
        spec:
          reference_sql: |
            SELECT c.channel_name, ROUND(SUM(o.order_amount), 2) AS gmv
            FROM channels c JOIN orders o ON o.channel_id = c.id
            WHERE o.paid_at >= '2026-06-01 00:00:00' AND o.paid_at < '2026-07-01 00:00:00'
              AND o.order_status NOT IN ('cancelled', 'canceled')
            GROUP BY c.id, c.channel_name ORDER BY gmv DESC, c.channel_name ASC
          columns: [channel_name, gmv]
          tolerance: 0.01
          column_aliases: {channel_name: [channel, name], gmv: [channel_gmv, sales]}
      - id: output_contract
        kind: output_contract
        spec: {columns: [channel_name, gmv], column_aliases: {channel_name: [channel, name], gmv: [channel_gmv, sales]}}
      - id: schema_context
        kind: schema_context
        spec:
          alternatives:
            - {tables: [orders_wide], columns: [channel_name, order_amount, paid_at], metrics: [gmv]}
            - {tables: [channels, orders], columns: [channel_name, order_amount, paid_at, channel_id], metrics: [gmv]}

  - id: june_channel_refund_rate_ranking
    question: 统计 2026 年 6 月各渠道退款率并按从高到低排序；分子只统计已完成退款的去重订单数。
    user_role: ops
    classification: stress
    tags: [database_exception, refund, channel, ranking]
    assertions:
      - id: semantic_result
        kind: result_match
        spec:
          reference_sql: |
            WITH eligible_orders AS (
              SELECT id, channel_id FROM orders
              WHERE paid_at >= '2026-06-01 00:00:00' AND paid_at < '2026-07-01 00:00:00'
                AND order_status NOT IN ('cancelled', 'canceled')
            ), completed_refunds AS (
              SELECT DISTINCT r.order_id FROM refunds r JOIN eligible_orders eo ON eo.id = r.order_id
              WHERE r.refund_status = 'completed'
            )
            SELECT c.channel_name, COUNT(DISTINCT cr.order_id) * 1.0 / COUNT(DISTINCT eo.id) AS refund_rate
            FROM channels c JOIN eligible_orders eo ON eo.channel_id = c.id LEFT JOIN completed_refunds cr ON cr.order_id = eo.id
            GROUP BY c.id, c.channel_name ORDER BY refund_rate DESC, c.channel_name ASC
          columns: [channel_name, refund_rate]
          tolerance: 0.000001
          column_aliases: {channel_name: [channel, name], refund_rate: [channel_refund_rate]}
      - id: output_contract
        kind: output_contract
        spec: {columns: [channel_name, refund_rate], column_aliases: {channel_name: [channel, name], refund_rate: [channel_refund_rate]}}
      - id: schema_context
        kind: schema_context
        spec: {required_tables: [channels, orders, refunds], required_columns: [channel_name, channel_id, order_id, paid_at, order_status, refund_status], required_metrics: [refund_rate]}

  - id: june_coupon_type_gmv
    question: 统计 2026 年 6 月各优惠券类型关联订单的 GMV，并按 GMV 从高到低排序。
    user_role: ops
    classification: stress
    tags: [database_exception, coupon, gmv]
    assertions:
      - id: semantic_result
        kind: result_match
        spec:
          reference_sql: |
            SELECT c.coupon_type, ROUND(SUM(o.order_amount), 2) AS gmv
            FROM coupons c JOIN order_coupons oc ON oc.coupon_id = c.id JOIN orders o ON o.id = oc.order_id
            WHERE o.paid_at >= '2026-06-01 00:00:00' AND o.paid_at < '2026-07-01 00:00:00'
              AND o.order_status NOT IN ('cancelled', 'canceled')
            GROUP BY c.coupon_type ORDER BY gmv DESC, c.coupon_type ASC
          columns: [coupon_type, gmv]
          tolerance: 0.01
          column_aliases: {coupon_type: [type, coupon], gmv: [coupon_gmv, sales]}
      - id: output_contract
        kind: output_contract
        spec: {columns: [coupon_type, gmv], column_aliases: {coupon_type: [type, coupon], gmv: [coupon_gmv, sales]}}
      - id: schema_context
        kind: schema_context
        spec: {required_tables: [coupons, order_coupons, orders], required_columns: [coupon_type, coupon_id, order_id, order_amount, paid_at, order_status], required_metrics: [gmv]}
