# M27 canonical catalog。旧 formal / challenge / diagnostic YAML 保持只读历史证据；
# 本文件只承载已确认且已由 typed scorer 覆盖的新合同。
contract_version: m27-v3

scenarios:
  - id: june_gmv
    question: 2026 年 6 月 GMV 是多少？
    user_role: ops
    classification: core
    tags: [gmv, core_metric]
    authority_refs: [domain_pack/metrics.yaml, docs/state/database-current-state.md]
    assertions:
      - id: semantic_result
        kind: result_match
        authority_refs: [domain_pack/metrics.yaml]
        spec:
          reference_sql: |
            SELECT ROUND(SUM(order_amount), 2) AS gmv
            FROM orders
            WHERE paid_at >= '2026-06-01 00:00:00'
              AND paid_at < '2026-07-01 00:00:00'
              AND order_status NOT IN ('cancelled', 'canceled')
          columns: [gmv]
          tolerance: 0.01
          column_aliases:
            gmv: [total_gmv]
      - id: output_contract
        kind: output_contract
        spec:
          columns: [gmv]
          column_aliases:
            gmv: [total_gmv]
      - id: schema_context
        kind: schema_context
        spec:
          required_tables: [orders]
          required_columns: [order_amount, paid_at, order_status]
          required_metrics: [gmv]
      - id: query_plan
        kind: query_plan
        spec:
          tables: [orders]
          metrics: [gmv]
          output_columns: [gmv]
      - id: trace_complete
        kind: trace_complete
        spec:
          required_steps:
            - {type: schema_retrieval, status: success}
            - {type: schema_context, status: success}
            - {type: query_plan, status: success}
            - {type: plan_validation, status: success}
            - {type: sql_generation, status: success}
            - {type: sql_guard, status: success}
            # 当前 TraceStep 的 machine type 为 sql_query；报告可将它投影为“SQL execution”。
            - {type: sql_query, status: success}
          allow_skipped: [join_path]

