            SELECT coupon_code, coupon_name, coupon_type FROM coupons
            WHERE coupon_code = 'JUNE_FIXED_50'
          columns: [coupon_code, coupon_name, coupon_type]
      - id: output_contract
        kind: output_contract
        spec: {columns: [coupon_code, coupon_name, coupon_type]}

  - id: june_net_revenue
    question: 2026 年 6 月净收入是多少？
    user_role: ops
    classification: core
    tags: [net_revenue, core_metric]
    assertions:
      - id: semantic_result
        kind: result_match
        spec:
          reference_sql: |
            SELECT ROUND(SUM(actual_amount), 2) AS net_revenue FROM orders
            WHERE paid_at >= '2026-06-01 00:00:00' AND paid_at < '2026-07-01 00:00:00'
              AND order_status NOT IN ('cancelled', 'canceled')
          columns: [net_revenue]
          tolerance: 0.01
          column_aliases: {net_revenue: [total_net_revenue]}
      - id: output_contract
        kind: output_contract
        spec: {columns: [net_revenue], column_aliases: {net_revenue: [total_net_revenue]}}

  - id: top_device_conversion
    question: 哪个设备类型加购到支付转化率最高？若并列按设备类型升序取 1 个
    user_role: ops
    classification: core
    tags: [conversion, behavior]
    assertions:
      - id: semantic_result
        kind: result_match
        spec:
          reference_sql: |
            SELECT device_type, SUM(CASE WHEN event_type = 'payment_success' THEN 1 ELSE 0 END) * 1.0
              / SUM(CASE WHEN event_type = 'add_to_cart' THEN 1 ELSE 0 END) AS conversion_rate
            FROM user_behavior_log GROUP BY device_type
            ORDER BY conversion_rate DESC, device_type ASC LIMIT 1
          columns: [device_type, conversion_rate]
          tolerance: 0.0001
          column_aliases: {conversion_rate: [add_to_pay_conversion_rate]}
      - id: output_contract
        kind: output_contract
        spec: {columns: [device_type, conversion_rate], column_aliases: {conversion_rate: [add_to_pay_conversion_rate]}}

  - id: june_fixed_coupon_top_channel
    question: JUNE_FIXED_50 在哪个渠道使用最多？若并列按渠道名称升序取 1 个
    user_role: ops
    classification: core
    tags: [coupon, channel, bridge_table]
    assertions:
      - id: semantic_result
        kind: result_match
        spec:
          reference_sql: |
            SELECT c.channel_name, COUNT(DISTINCT o.id) AS coupon_order_count
            FROM orders o JOIN channels c ON c.id = o.channel_id
            JOIN order_coupons oc ON oc.order_id = o.id JOIN coupons cp ON cp.id = oc.coupon_id
            WHERE cp.coupon_code = 'JUNE_FIXED_50' GROUP BY c.id, c.channel_name
            ORDER BY coupon_order_count DESC, c.channel_name ASC LIMIT 1
          columns: [channel_name, coupon_order_count]
          tolerance: 0.01
          column_aliases: {coupon_order_count: [usage_count, used_order_count]}
      - id: output_contract
        kind: output_contract
        spec: {columns: [channel_name, coupon_order_count], column_aliases: {coupon_order_count: [usage_count, used_order_count]}}

  - id: june_completed_orders_top10
    question: 查询 2026 年 6 月成交订单，仅返回订单号、订单金额和支付时间，按支付时间升序取前 10 条
    user_role: ops
    classification: core
    tags: [orders, completed_order]
    assertions:
      - id: semantic_result
        kind: result_match
        spec:
          reference_sql: |
            SELECT order_no, order_amount, paid_at FROM orders
            WHERE paid_at >= '2026-06-01 00:00:00' AND paid_at < '2026-07-01 00:00:00'
              AND order_status NOT IN ('cancelled', 'canceled') ORDER BY paid_at ASC LIMIT 10
          columns: [order_no, order_amount, paid_at]
      - id: output_contract
        kind: output_contract
        spec: {columns: [order_no, order_amount, paid_at]}

  - id: channel_order_ranking
    question: 统计各渠道订单量，按订单量降序、渠道名称升序排列
    user_role: ops
    classification: core
    tags: [channel, order_count]
    assertions:
      - id: semantic_result
        kind: result_match
        spec:
          reference_sql: |
            SELECT c.channel_name, COUNT(o.id) AS order_count FROM channels c
            JOIN orders o ON o.channel_id = c.id GROUP BY c.id, c.channel_name
            ORDER BY order_count DESC, c.channel_name ASC
          columns: [channel_name, order_count]
          tolerance: 0.01
      - id: output_contract
        kind: output_contract
        spec: {columns: [channel_name, order_count]}

  - id: june_product_sales_top5
    question: 2026 年 6 月商品销售额 Top 5，按销售额降序、商品名称升序排列
    user_role: ops
    classification: core
    tags: [product, item_gmv, ranking]
    assertions:
      - id: semantic_result
        kind: result_match
        spec:
          reference_sql: |
            SELECT p.product_name, ROUND(SUM(oi.line_amount), 2) AS item_gmv
            FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN products p ON p.id = oi.product_id
            WHERE o.paid_at >= '2026-06-01 00:00:00' AND o.paid_at < '2026-07-01 00:00:00'
              AND o.order_status NOT IN ('cancelled', 'canceled')
            GROUP BY p.id, p.product_name ORDER BY item_gmv DESC, p.product_name ASC LIMIT 5
          columns: [product_name, item_gmv]
          tolerance: 0.01
          column_aliases: {product_name: [product_name_snapshot]}
      - id: output_contract
        kind: output_contract
        spec: {columns: [product_name, item_gmv], column_aliases: {product_name: [product_name_snapshot]}}
      - id: schema_context
        kind: schema_context
        spec:
          required_tables: [orders, order_items, products]
          required_columns: [product_name, line_amount, paid_at, order_status]

  - id: june_channel_gmv_ranking
    question: 2026 年 6 月各渠道 GMV 排名，按 GMV 降序、渠道名称升序排列
    user_role: ops
    classification: stress
    tags: [channel, gmv, query_plan]
    assertions:
      - id: semantic_result
        kind: result_match
        spec:
          reference_sql: |
            SELECT c.channel_name, ROUND(SUM(o.order_amount), 2) AS gmv
            FROM channels c JOIN orders o ON o.channel_id = c.id
            WHERE o.paid_at >= '2026-06-01 00:00:00' AND o.paid_at < '2026-07-01 00:00:00'
              AND o.order_status NOT IN ('cancelled', 'canceled')
            GROUP BY c.id, c.channel_name ORDER BY gmv DESC, c.channel_name ASC
          columns: [channel_name, gmv]
          tolerance: 0.01
      - id: output_contract
        kind: output_contract
        spec: {columns: [channel_name, gmv]}
      - id: query_plan
        kind: query_plan
        spec:
          tables: [channels, orders]
          joins: [orders_channel]
          metrics: [gmv]
          group_by: [channel_name]
          order_by: [gmv DESC]
          output_columns: [channel_name, gmv]
      - id: join_path
        kind: join_path
        spec: {relation_ids: [orders_channel]}

  - id: june_root_category_sales
    question: 统计 2026 年 6 月一级类目（含其所有子类目）的商品销售额，按销售额降序、一级类目名称升序排名
    user_role: ops
    classification: stress
    tags: [recursive_cte, item_gmv, category]
    assertions:
      - id: semantic_result
        kind: result_match
        spec:
          reference_sql: |
            WITH RECURSIVE category_tree AS (
              SELECT id, name, parent_id, name AS root_category FROM product_categories WHERE parent_id IS NULL
              UNION ALL
              SELECT child.id, child.name, child.parent_id, tree.root_category FROM product_categories child
              JOIN category_tree tree ON child.parent_id = tree.id
            )
            SELECT tree.root_category, ROUND(SUM(oi.line_amount), 2) AS item_gmv
            FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN products p ON p.id = oi.product_id
            JOIN category_tree tree ON tree.id = p.category_id
            WHERE o.paid_at >= '2026-06-01 00:00:00' AND o.paid_at < '2026-07-01 00:00:00'
              AND o.order_status NOT IN ('cancelled', 'canceled')
            GROUP BY tree.root_category ORDER BY item_gmv DESC, tree.root_category ASC
          columns: [root_category, item_gmv]
          tolerance: 0.01
          column_aliases: {root_category: [category, category_name], item_gmv: [category_gmv, sales]}
      - id: output_contract
        kind: output_contract
        spec: {columns: [root_category, item_gmv], column_aliases: {root_category: [category, category_name], item_gmv: [category_gmv, sales]}}

  # Database Exception selector 将复用这三条 Stress scenario，不再复制 YAML 正文。
  - id: signed_net_refund_amount
    question: 截至 2026 年 7 月 31 日，实际净退款金额是多少？只统计已完成退款，负数冲销需要保留负号。
    user_role: ops
    classification: stress
    tags: [database_exception, refund, signed_amount]
    assertions:
      - id: semantic_result
        kind: result_match
        spec:
          reference_sql: |
            SELECT ROUND(SUM(refund_amount), 2) AS net_refund_amount FROM refunds
            WHERE refund_status = 'completed' AND processed_at < '2026-08-01 00:00:00'
          columns: [net_refund_amount]
          tolerance: 0.01
          column_aliases: {net_refund_amount: [actual_net_refund_amount, total_refund_amount]}
      - id: output_contract
        kind: output_contract
        spec: {columns: [net_refund_amount], column_aliases: {net_refund_amount: [actual_net_refund_amount, total_refund_amount]}}

  - id: channel_net_refund_amount
    question: 按退款处理完成时间统计，2026 年 6 月各渠道实际净退款金额是多少？退款关联订单必须使用内部关联关系。
    user_role: ops
    classification: stress
    tags: [database_exception, refund, foreign_key_join]
    assertions:
      - id: semantic_result
        kind: result_match
        spec:
          reference_sql: |
            SELECT c.channel_name, ROUND(SUM(r.refund_amount), 2) AS net_refund_amount
            FROM refunds r JOIN orders o ON o.id = r.order_id JOIN channels c ON c.id = o.channel_id
            WHERE r.refund_status = 'completed' AND r.processed_at >= '2026-06-01 00:00:00'
              AND r.processed_at < '2026-07-01 00:00:00'
            GROUP BY c.id, c.channel_name ORDER BY net_refund_amount DESC, c.channel_name ASC
          columns: [channel_name, net_refund_amount]
          tolerance: 0.01
          column_aliases: {net_refund_amount: [actual_net_refund_amount, total_refund_amount]}
      - id: output_contract
        kind: output_contract
        spec: {columns: [channel_name, net_refund_amount], column_aliases: {net_refund_amount: [actual_net_refund_amount, total_refund_amount]}}
      - id: join_path
        kind: join_path
        spec: {relation_ids: [refunds_order, orders_channel]}

  - id: order_item_amount_reconciliation
    question: 找出订单总金额与商品明细金额合计不一致的订单，共有多少笔？
    user_role: ops
    classification: stress
    tags: [database_exception, reconciliation]
    assertions:
      - id: semantic_result
        kind: result_match
        spec:
          reference_sql: |
            WITH item_totals AS (SELECT order_id, ROUND(SUM(line_amount), 2) AS item_amount FROM order_items GROUP BY order_id)
            SELECT COUNT(*) AS mismatch_order_count FROM orders o JOIN item_totals it ON it.order_id = o.id
            WHERE ROUND(o.order_amount, 2) <> it.item_amount
          columns: [mismatch_order_count]
      - id: output_contract
        kind: output_contract
        spec: {columns: [mismatch_order_count]}

  # P0 迁移矩阵中尚未落地的 7 条业务合同。每条只出现一次；多种检查均挂在同一 scenario 下。
  - id: june_product_refund_rate_ranking
    question: 统计 2026 年 6 月各商品退款率并按从高到低排序。退款率分母为同期非取消订单中包含该商品的去重订单数，分子为已完成退款的去重订单数。
    user_role: ops
    classification: core
    tags: [database, refund, ranking, canonical_merge]
    assertions:
      - id: semantic_result
        kind: result_match
        spec:
          reference_sql: |
            WITH eligible_order_items AS (
              SELECT oi.order_id, oi.product_id FROM order_items oi JOIN orders o ON o.id = oi.order_id
              WHERE o.paid_at >= '2026-06-01 00:00:00' AND o.paid_at < '2026-07-01 00:00:00'
                AND o.order_status NOT IN ('cancelled', 'canceled')
            ), refunds_by_product AS (
              SELECT COALESCE(oi.product_id, r.product_id) AS product_id, COUNT(DISTINCT r.order_id) AS refunded_order_count
              FROM refunds r JOIN orders o ON o.id = r.order_id LEFT JOIN order_items oi ON oi.id = r.order_item_id
              WHERE o.paid_at >= '2026-06-01 00:00:00' AND o.paid_at < '2026-07-01 00:00:00'
                AND o.order_status NOT IN ('cancelled', 'canceled') AND r.refund_status = 'completed'
                AND COALESCE(oi.product_id, r.product_id) IS NOT NULL
              GROUP BY COALESCE(oi.product_id, r.product_id)
            )
            SELECT p.product_name, COALESCE(rb.refunded_order_count, 0) * 1.0 / COUNT(DISTINCT eoi.order_id) AS refund_rate
            FROM products p JOIN eligible_order_items eoi ON eoi.product_id = p.id LEFT JOIN refunds_by_product rb ON rb.product_id = p.id
            GROUP BY p.id, p.product_name, rb.refunded_order_count ORDER BY refund_rate DESC, p.product_name ASC
          columns: [product_name, refund_rate]
          tolerance: 0.000001
          column_aliases: {product_name: [name, product], refund_rate: [product_refund_rate]}
      - id: output_contract
        kind: output_contract
        spec: {columns: [product_name, refund_rate], column_aliases: {product_name: [name, product], refund_rate: [product_refund_rate]}}
      - id: schema_context
        kind: schema_context
        spec: {required_tables: [products, order_items, orders, refunds], required_columns: [product_name, product_id, order_id, paid_at, order_status, refund_status], required_metrics: [refund_rate]}

  - id: digital_electronics_recursive_item_gmv
    question: 统计 2026 年 6 月“数码电子”及其所有子分类的商品明细成交额（item GMV）。
    user_role: ops
    classification: stress
    tags: [database_exception, recursive_cte, category]
    assertions:
      - id: semantic_result
        kind: result_match
        spec:
          reference_sql: |
            WITH RECURSIVE category_tree AS (
              SELECT id, name, parent_id, name AS root_category FROM product_categories WHERE name = '数码电子'
              UNION ALL
              SELECT pc.id, pc.name, pc.parent_id, ct.root_category FROM product_categories pc JOIN category_tree ct ON pc.parent_id = ct.id
            )
            SELECT ct.root_category, ROUND(SUM(oi.line_amount), 2) AS item_gmv
            FROM category_tree ct JOIN products p ON p.category_id = ct.id JOIN order_items oi ON oi.product_id = p.id JOIN orders o ON o.id = oi.order_id
            WHERE o.paid_at >= '2026-06-01 00:00:00' AND o.paid_at < '2026-07-01 00:00:00'
              AND o.order_status NOT IN ('cancelled', 'canceled')
            GROUP BY ct.root_category
          columns: [root_category, item_gmv]
          tolerance: 0.01
          column_aliases: {root_category: [category, category_name], item_gmv: [category_gmv, sales]}
      - id: output_contract
        kind: output_contract
        spec: {columns: [root_category, item_gmv], column_aliases: {root_category: [category, category_name], item_gmv: [category_gmv, sales]}}
      - id: schema_context
        kind: schema_context
        spec: {required_tables: [product_categories, products, order_items, orders], required_columns: [name, parent_id, category_id, product_id, line_amount, paid_at, order_status]}

  - id: june_avg_price_history
    question: 统计 2026 年 6 月每个商品有效售价区间的平均价格；必须覆盖 valid_to 为空的当前价格记录。
    user_role: ops
    classification: stress
    tags: [database_exception, scd, temporal]
    assertions:
      - id: semantic_result
        kind: result_match
        spec:
          reference_sql: |
            SELECT p.product_name, ROUND(AVG(pph.price), 2) AS avg_price
            FROM products p JOIN product_price_history pph ON pph.product_id = p.id
            WHERE pph.valid_from < '2026-07-01 00:00:00'
              AND (pph.valid_to IS NULL OR pph.valid_to > '2026-06-01 00:00:00')
            GROUP BY p.id, p.product_name ORDER BY p.product_name ASC
          columns: [product_name, avg_price]
          tolerance: 0.01
          column_aliases: {product_name: [name, product], avg_price: [average_price]}
      - id: output_contract
        kind: output_contract
        spec: {columns: [product_name, avg_price], column_aliases: {product_name: [name, product], avg_price: [average_price]}}
      - id: schema_context
        kind: schema_context
        spec: {required_tables: [products, product_price_history], required_columns: [product_name, product_id, price, valid_from, valid_to]}

  - id: june_actual_amount_sum
    question: 统计 2026 年 6 月非取消订单的实际成交金额合计，使用 orders.actual_amount 的业务口径。
    user_role: ops
    classification: core
    tags: [database, metric_mapping, actual_amount]
