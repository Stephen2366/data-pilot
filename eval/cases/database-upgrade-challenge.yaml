        AND paid_at < '2026-07-01 00:00:00'
        AND order_status NOT IN ('cancelled', 'canceled')
  - id: db_core_002
    task_type: core_metric
    question: 2026 年 6 月退款率最高的商品是什么？若并列按商品名称升序取 1 个
    user_role: ops
    expected_tables: [products, order_items, orders, refunds]
    expected_columns: [product_name, refund_rate]
    expected_metrics: [refund_rate]
    phase3a_capabilities: [schema_retrieval, query_plan]
    phase3a_blocking: true
    security_expectation: allow
    contract_adjustment: 商品退款率统一为成交订单内的已完成退款去重订单数 / 成交去重订单数；明细优先归因，整单退款回退 refunds.product_id。
    check: {type: result_match, tolerance: 0.0001}
    expected_sql: |
      WITH eligible_order_items AS (
        SELECT oi.order_id, oi.product_id
        FROM order_items oi
        JOIN orders o ON o.id = oi.order_id
        WHERE o.paid_at >= '2026-06-01 00:00:00'
          AND o.paid_at < '2026-07-01 00:00:00'
          AND o.order_status NOT IN ('cancelled', 'canceled')
      ), refunds_by_product AS (
        SELECT COALESCE(oi.product_id, r.product_id) AS product_id,
               COUNT(DISTINCT r.order_id) AS refunded_order_count
        FROM refunds r
        JOIN orders o ON o.id = r.order_id
        LEFT JOIN order_items oi ON oi.id = r.order_item_id
        WHERE o.paid_at >= '2026-06-01 00:00:00'
          AND o.paid_at < '2026-07-01 00:00:00'
          AND o.order_status NOT IN ('cancelled', 'canceled')
          AND r.refund_status = 'completed'
          AND COALESCE(oi.product_id, r.product_id) IS NOT NULL
        GROUP BY COALESCE(oi.product_id, r.product_id)
      )
      SELECT p.product_name,
             COALESCE(rb.refunded_order_count, 0) * 1.0 / COUNT(DISTINCT eoi.order_id) AS refund_rate
      FROM products p
      JOIN eligible_order_items eoi ON eoi.product_id = p.id
      LEFT JOIN refunds_by_product rb ON rb.product_id = p.id
      GROUP BY p.id, p.product_name, rb.refunded_order_count
      ORDER BY refund_rate DESC, p.product_name ASC
      LIMIT 1
