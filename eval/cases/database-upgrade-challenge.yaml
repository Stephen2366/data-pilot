  - id: db_core_004
    task_type: core_metric
    question: 统计各渠道订单量，按订单量降序、渠道名称升序排列
    user_role: ops
    expected_tables: [channels, orders]
    expected_columns: [channel_name, order_count]
    expected_metrics: [order_count]
    phase3a_capabilities: [schema_retrieval, join_path]
    phase3a_blocking: true
    security_expectation: allow
    check: {type: result_match, tolerance: 0.01}
    expected_sql: |
      SELECT c.channel_name, COUNT(o.id) AS order_count
      FROM channels c
      JOIN orders o ON o.channel_id = c.id
      GROUP BY c.id, c.channel_name
      ORDER BY order_count DESC, c.channel_name ASC

  - id: db_multi_001
    semantic_group_id: june_fixed_coupon_top_channel
    task_type: multi_table
    question: JUNE_FIXED_50 在哪个渠道使用最多？若并列按渠道名称升序取 1 个
    user_role: ops
    expected_tables: [orders, channels, order_coupons, coupons]
    expected_columns: [channel_name, coupon_order_count]
    expected_column_aliases:
      coupon_order_count: [usage_count, used_order_count]
    expected_metrics: [coupon_order_count]
    phase3a_capabilities: [schema_retrieval, join_path, query_plan]
    phase3a_blocking: true
    security_expectation: allow
    contract_adjustment: 优惠券使用题统一为 coupon_order_count；允许 usage_count 和 used_order_count 等价别名。
    check: {type: result_match, tolerance: 0.01}
    expected_sql: |
      SELECT c.channel_name, COUNT(DISTINCT o.id) AS coupon_order_count
      FROM orders o
      JOIN channels c ON c.id = o.channel_id
      JOIN order_coupons oc ON oc.order_id = o.id
      JOIN coupons cp ON cp.id = oc.coupon_id
      WHERE cp.coupon_code = 'JUNE_FIXED_50'
      GROUP BY c.id, c.channel_name
      ORDER BY coupon_order_count DESC, c.channel_name ASC
      LIMIT 1
  - id: db_multi_002
    semantic_group_id: june_root_category_sales
    task_type: multi_table
    question: 统计 2026 年 6 月一级类目（含其所有子类目）的商品销售额，按销售额降序、一级类目名称升序排名
    user_role: ops
    expected_tables: [product_categories, products, order_items, orders]
    expected_columns: [root_category, item_gmv]
    expected_column_aliases:
      root_category: [category, category_name]
      item_gmv: [category_gmv, sales]
    expected_metrics: [item_gmv]
    phase3a_capabilities: [schema_retrieval, join_path, local_schema_prompt]
    phase3a_blocking: true
    security_expectation: allow
    contract_adjustment: 一级类目改为 product_categories 规范类目树口径，不再使用 products.category 兼容字段。
    check: {type: result_match, tolerance: 0.01}
    expected_sql: |
      WITH RECURSIVE category_tree AS (
        SELECT id, name, parent_id, name AS root_category
        FROM product_categories
        WHERE parent_id IS NULL
        UNION ALL
        SELECT child.id, child.name, child.parent_id, tree.root_category
        FROM product_categories child
        JOIN category_tree tree ON child.parent_id = tree.id
      )
      SELECT tree.root_category, ROUND(SUM(oi.line_amount), 2) AS item_gmv
      FROM order_items oi
      JOIN orders o ON o.id = oi.order_id
      JOIN products p ON p.id = oi.product_id
      JOIN category_tree tree ON tree.id = p.category_id
      WHERE o.paid_at >= '2026-06-01 00:00:00'
        AND o.paid_at < '2026-07-01 00:00:00'
        AND o.order_status NOT IN ('cancelled', 'canceled')
      GROUP BY tree.root_category
      ORDER BY item_gmv DESC, tree.root_category ASC
