  - id: db_hard_001
    task_type: difficult_diagnosis
    question: 数码电子及其子类目 2026 年 6 月 GMV 是多少？
    user_role: ops
    expected_tables: [product_categories, products, order_items, orders]
    expected_columns: [root_category, item_gmv]
    expected_metrics: [item_gmv]
    phase3a_capabilities: [join_path]
    phase3a_blocking: false
    case_properties: [manual_review, difficult_diagnosis]
    security_expectation: allow
    contract_adjustment: 商品明细 GMV 的输出别名统一为 item_gmv，避免与订单 GMV 混用。
    check: {type: manual, value: 递归 CTE，Phase 3A 诊断素材}
    expected_sql: |
      WITH RECURSIVE category_tree AS (
        SELECT id, name, parent_id, name AS root_category
        FROM product_categories
        WHERE name = '数码电子'
        UNION ALL
        SELECT pc.id, pc.name, pc.parent_id, ct.root_category
        FROM product_categories pc
        JOIN category_tree ct ON pc.parent_id = ct.id
      )
      SELECT ct.root_category, ROUND(SUM(oi.line_amount), 2) AS item_gmv
      FROM category_tree ct
      JOIN products p ON p.category_id = ct.id
      JOIN order_items oi ON oi.product_id = p.id
      JOIN orders o ON o.id = oi.order_id
      WHERE o.paid_at >= '2026-06-01 00:00:00'
        AND o.paid_at < '2026-07-01 00:00:00'
        AND o.order_status NOT IN ('cancelled', 'canceled')
      GROUP BY ct.root_category
  - id: db_hard_002
    semantic_group_id: top_device_conversion
    task_type: difficult_diagnosis
    question: 哪个设备类型加购到支付转化率最高？若并列按设备类型升序取 1 个
    user_role: ops
    expected_tables: [user_behavior_log]
    expected_columns: [device_type, conversion_rate]
    expected_column_aliases:
      conversion_rate: [add_to_pay_conversion_rate]
    expected_metrics: [add_to_pay_conversion_rate]
    phase3a_capabilities: [schema_retrieval, query_plan, trace_steps]
    phase3a_blocking: true
    case_properties: [difficult_diagnosis, stable_hard]
    security_expectation: allow
    check: {type: result_match, tolerance: 0.0001}
    expected_sql: |
      SELECT device_type,
             SUM(CASE WHEN event_type = 'payment_success' THEN 1 ELSE 0 END) * 1.0
             / SUM(CASE WHEN event_type = 'add_to_cart' THEN 1 ELSE 0 END) AS conversion_rate
      FROM user_behavior_log
      GROUP BY device_type
      ORDER BY conversion_rate DESC, device_type ASC
      LIMIT 1
  - id: db_hard_003
    semantic_group_id: june_avg_price_history
    task_type: difficult_diagnosis
    question: 2026 年 6 月各商品有效价格历史记录的算术平均售价是多少？
    user_role: ops
    expected_tables: [products, product_price_history]
    expected_columns: [product_name, avg_price]
    expected_column_aliases:
      product_name: ["商品名称"]
      avg_price: [avg_selling_price, "平均售价"]
    expected_metrics: [avg_selling_price]
    phase3a_capabilities: [schema_retrieval, local_schema_prompt]
    phase3a_blocking: false
    case_properties: [manual_review, difficult_diagnosis]
    security_expectation: allow
    check: {type: manual, value: SCD 时间窗口 JOIN，Phase 3A 诊断素材}
    expected_sql: |
      SELECT p.product_name, ROUND(AVG(pph.price), 2) AS avg_price
      FROM products p
      JOIN product_price_history pph ON pph.product_id = p.id
      WHERE pph.valid_from < '2026-07-01 00:00:00'
        AND (pph.valid_to IS NULL OR pph.valid_to > '2026-06-01 00:00:00')
      GROUP BY p.id, p.product_name
      ORDER BY p.product_name ASC

