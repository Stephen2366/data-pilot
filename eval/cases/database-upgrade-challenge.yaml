# Phase 2.7 数据库升级挑战集：验证新库复杂度和固定事实，不替代 Phase 3A 10 条 regression。
cases:
  - id: db_simple_001
    semantic_group_id: active_products_top10
    task_type: simple_sql
    question: 查询 active 商品列表，仅返回商品名称、旧版类目和状态，按商品名称升序取前 10 条
    user_role: ops
    expected_tables: [products]
    expected_columns: [product_name, category, status]
    expected_metrics: []
    phase3a_capabilities: [schema_retrieval]
    phase3a_blocking: true
    security_expectation: allow
    check: {type: result_match}
    expected_sql: |
      SELECT product_name, category, status
      FROM products
      WHERE status = 'active'
      ORDER BY product_name ASC
      LIMIT 10
