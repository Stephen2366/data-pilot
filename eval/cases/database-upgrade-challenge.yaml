  - id: db_core_001
    semantic_group_id: june_gmv
    task_type: core_metric
    question: 2026 年 6 月 GMV 是多少？
    user_role: ops
    expected_tables: [orders]
    expected_columns: [gmv]
    expected_column_aliases:
      gmv: [total_gmv]
    expected_metrics: [gmv]
    phase3a_capabilities: [schema_retrieval, query_plan, trace_steps]
    phase3a_blocking: true
    security_expectation: allow
    check: {type: result_match, tolerance: 0.01}
    expected_sql: |
      SELECT ROUND(SUM(order_amount), 2) AS gmv
      FROM orders
