# Phase 3A M8 输入：10 条新库正式回归。数据库升级阶段只落文件，不跑 M8 baseline。
cases:
  - id: p3a_simple_001
    semantic_group_id: active_products_top10
    task_type: simple_sql
    question: 查询 active 商品列表，仅返回商品名称、旧版类目和状态，按商品名称升序取前 10 条
    user_role: ops
    expected_tables: [products]
    expected_columns: [product_name, category, status]
    expected_metrics: []
    security_expectation: allow
    check: {type: result_match}
    expected_sql: |
      SELECT product_name, category, status
      FROM products
      WHERE status = 'active'
      ORDER BY product_name ASC
      LIMIT 10
  - id: p3a_simple_002
    semantic_group_id: june_fixed_coupon_basic_info
    task_type: simple_sql
    question: 查询 JUNE_FIXED_50 优惠券的券码、名称和类型
    user_role: ops
    expected_tables: [coupons]
    expected_columns: [coupon_code, coupon_name, coupon_type]
    expected_metrics: []
    security_expectation: allow
    check: {type: result_match}
    expected_sql: |
      SELECT coupon_code, coupon_name, coupon_type
      FROM coupons
      WHERE coupon_code = 'JUNE_FIXED_50'
  - id: p3a_agg_001
    semantic_group_id: june_gmv
    task_type: aggregation
    question: 2026 年 6 月 GMV 是多少？
    user_role: ops
    expected_tables: [orders]
    expected_columns: [gmv]
    expected_column_aliases:
      gmv: [total_gmv, "2026年6月GMV"]
    expected_metrics: [gmv]
    security_expectation: allow
    check: {type: expected_value, field: gmv, value: 11285752.00, tolerance: 0.01}
  - id: p3a_agg_002
    semantic_group_id: june_net_revenue
    task_type: aggregation
    question: 2026 年 6 月净收入是多少？
    user_role: ops
    expected_tables: [orders]
    expected_columns: [net_revenue]
    expected_column_aliases:
      net_revenue: [total_net_revenue]
    expected_metrics: [net_revenue]
    security_expectation: allow
    check: {type: expected_value, field: net_revenue, value: 11293058.25, tolerance: 0.01}
  - id: p3a_agg_003
    semantic_group_id: top_device_conversion
    task_type: aggregation
    question: 哪个设备类型加购到支付转化率最高？若并列按设备类型升序取 1 个
    user_role: ops
    expected_tables: [user_behavior_log]
    expected_columns: [device_type, conversion_rate]
    expected_column_aliases:
      conversion_rate: [add_to_pay_conversion_rate]
    expected_metrics: [add_to_pay_conversion_rate]
    security_expectation: allow
    check: {type: result_match, tolerance: 0.0001}
    expected_sql: |
      SELECT device_type,
             SUM(CASE WHEN event_type = 'payment_success' THEN 1 ELSE 0 END) * 1.0
             / SUM(CASE WHEN event_type = 'add_to_cart' THEN 1 ELSE 0 END) AS conversion_rate
      FROM user_behavior_log
      GROUP BY device_type
      ORDER BY conversion_rate DESC, device_type ASC
      LIMIT 1
  - id: p3a_multi_001
    semantic_group_id: june_fixed_coupon_top_channel
    task_type: multi_table
    question: JUNE_FIXED_50 在哪个渠道使用最多？若并列按渠道名称升序取 1 个
    user_role: ops
    expected_tables: [orders, channels, order_coupons, coupons]
    expected_columns: [channel_name, coupon_order_count]
    expected_column_aliases:
      coupon_order_count: [usage_count, used_order_count]
    expected_metrics: [coupon_order_count]
    contract_adjustment: 优惠券使用题统一为 coupon_order_count，允许等价计数别名。
    security_expectation: allow
    check: {type: result_match, tolerance: 0.01}
    expected_sql: |
      SELECT c.channel_name, COUNT(DISTINCT o.id) AS coupon_order_count
      FROM orders o
      JOIN channels c ON c.id = o.channel_id
      JOIN order_coupons oc ON oc.order_id = o.id
      JOIN coupons cp ON cp.id = oc.coupon_id
      WHERE cp.coupon_code = 'JUNE_FIXED_50'
      GROUP BY c.id, c.channel_name
      ORDER BY coupon_order_count DESC, c.channel_name ASC
      LIMIT 1
  - id: p3a_multi_002
    semantic_group_id: june_product_sales_top5
    task_type: multi_table
    question: 2026 年 6 月商品销售额 Top 5，按销售额降序、商品名称升序排列
    user_role: ops
    expected_tables: [orders, order_items, products]
    expected_columns: [product_name, item_gmv]
    expected_column_aliases:
      product_name: [product_name_snapshot]
    expected_metrics: [item_gmv]
    security_expectation: allow
    check: {type: result_match, tolerance: 0.01}
    expected_sql: |
      SELECT p.product_name, ROUND(SUM(oi.line_amount), 2) AS item_gmv
      FROM order_items oi
      JOIN orders o ON o.id = oi.order_id
      JOIN products p ON p.id = oi.product_id
      WHERE o.paid_at >= '2026-06-01 00:00:00'
        AND o.paid_at < '2026-07-01 00:00:00'
        AND o.order_status NOT IN ('cancelled', 'canceled')
      GROUP BY p.id, p.product_name
      ORDER BY item_gmv DESC, p.product_name ASC
      LIMIT 5
  - id: p3a_multi_003
    semantic_group_id: june_root_category_sales
    task_type: multi_table
    question: 统计 2026 年 6 月一级类目（含其所有子类目）的商品销售额，按销售额降序、一级类目名称升序排名
    user_role: ops
    expected_tables: [product_categories, products, order_items, orders]
    expected_columns: [root_category, item_gmv]
    expected_column_aliases:
      root_category: [category, category_name]
      item_gmv: [category_gmv, sales]
    expected_metrics: [item_gmv]
    security_expectation: allow
    contract_adjustment: 一级类目改用 product_categories 规范类目树口径。
    check: {type: result_match, tolerance: 0.01}
    expected_sql: |
      WITH RECURSIVE category_tree AS (
        SELECT id, name, parent_id, name AS root_category
        FROM product_categories
        WHERE parent_id IS NULL
        UNION ALL
        SELECT child.id, child.name, child.parent_id, tree.root_category
        FROM product_categories child
        JOIN category_tree tree ON child.parent_id = tree.id
      )
      SELECT tree.root_category, ROUND(SUM(oi.line_amount), 2) AS item_gmv
      FROM order_items oi
      JOIN orders o ON o.id = oi.order_id
      JOIN products p ON p.id = oi.product_id
      JOIN category_tree tree ON tree.id = p.category_id
      WHERE o.paid_at >= '2026-06-01 00:00:00'
        AND o.paid_at < '2026-07-01 00:00:00'
        AND o.order_status NOT IN ('cancelled', 'canceled')
      GROUP BY tree.root_category
      ORDER BY item_gmv DESC, tree.root_category ASC
